<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DZ DROP ZONE</title>
<meta name="description" content="DZ Drop Zone — DZMarkup, DZDocu and DZVidStitch.">
<link rel="icon" href="logos/dzdocu.png">
<style>
  /* Same palette as the apps' own setup screens, so the hub reads as the
     same family rather than a separate site. */
  :root {
    --bg-1: #080e1b;
    --bg-2: #17293b;
    --bg-3: #27435e;
    --bg-4: #365a7d;
    --accent: #5980a6;
    --text: #eaf2ff;
    --muted: #9dc6f0;
    --card: #14283c;
    --card-line: #2f6fb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 65%, var(--bg-4) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 20px 40px;
  }
  header { text-align: center; margin-bottom: 6vh; }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(30px, 6vw, 54px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .tag {
    margin: 0;
    font-size: clamp(12px, 2.2vw, 15px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 26px;
    width: 100%;
    max-width: 900px;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    padding: 30px 22px 26px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .app:hover, .app:focus-visible {
    transform: translateY(-4px);
    border-color: var(--muted);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    outline: none;
  }
  .shot { width: 116px; height: 116px; margin-bottom: 18px; position: relative; }
  .shot img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  /* Shown only when a logo file isn't there yet — the tile still looks
     deliberate instead of showing a broken image. Swap in a real logo and it
     takes over automatically; nothing here needs changing. */
  .shot .mark {
    width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--card-line);
    border-radius: 10px;
    background: #0d1a29;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .shot img.missing { display: none; }
  .shot img.missing + .mark { display: flex; }
  .name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .what { font-size: 13px; line-height: 1.5; color: var(--muted); }
  footer {
    margin-top: auto;
    padding-top: 7vh;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    opacity: 0.75;
  }
</style>
</head>
<body>

<header>
  <h1>DZ Drop Zone</h1>
  <p class="tag">Drop a file in. Get something out.</p>
</header>

<main class="apps">

  <a class="app" href="dzdocu/">
    <div class="shot">
      <img src="logos/dzdocu.png" alt="DZDocu">
      <div class="mark">DOCU</div>
    </div>
    <div class="name">DZDocu</div>
    <div class="what">Write, lay out and print documents and labels. Drop in a file to start.</div>
  </a>

  <a class="app" href="dzmarkup/">
    <div class="shot">
      <img src="logos/dzmarkup.png" alt="DZMarkup">
      <div class="mark">MARK</div>
    </div>
    <div class="name">DZMarkup</div>
    <div class="what">Mark up and annotate.</div>
  </a>

  <a class="app" href="dzvidstitch/">
    <div class="shot">
      <img src="logos/dzvidstitch.png" alt="DZVidStitch">
      <div class="mark">VID</div>
    </div>
    <div class="name">DZVidStitch</div>
    <div class="what">Stitch and edit video.</div>
  </a>

</main>

<footer>dzdropzone.com</footer>

<script>
  // A logo that hasn't been added yet shows its lettered placeholder instead
  // of a broken-image icon. Runs on load as well as on error, so it is right
  // even for images the browser had already given up on before this ran.
  (function () {
    var imgs = document.querySelectorAll('.shot img');
    for (var i = 0; i < imgs.length; i++) {
      (function (img) {
        var flag = function () { img.classList.add('missing'); };
        img.addEventListener('error', flag);
        if (img.complete && img.naturalWidth === 0) flag();
      })(imgs[i]);
    }
  })();
</script>

</body>
</html>
