<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DZ Video-Converter</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#111727;--panel2:#0d1220;--line:#283148;--text:#edf3ff;--muted:#8994ad;--pink:#ff43c8;--cyan:#22e4ff;--green:#55e6a5;--danger:#ff748e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 480px at 50% -180px,#20204b 0%,transparent 70%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}main{max-width:850px;margin:0 auto;padding:24px 16px}header{padding:16px 0 14px;border-bottom:1px solid var(--line);position:relative;display:flex;justify-content:center;align-items:center;margin:0}header img.site-logo{height:144px;width:auto;display:block}header .logo-link{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;transition:.3s}header .logo-link img{height:50px;width:auto;opacity:.7;transition:.3s}header .logo-link:hover img{opacity:1;filter:drop-shadow(0 0 12px rgba(34,228,255,.6))}header .info-link{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--cyan);text-decoration:none;white-space:nowrap;font-size:.85rem;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:7px 13px;transition:.2s}header .info-link:hover{border-color:var(--cyan);background:rgba(34,228,255,.08)}.drop{border:2px dashed #3b4661;border-radius:16px;padding:52px 24px;text-align:center;background:linear-gradient(135deg,rgba(255,67,200,.035),rgba(34,228,255,.035));cursor:pointer;transition:.2s;margin-bottom:24px}.drop:hover,.drop.drag{border-color:var(--cyan);background:rgba(34,228,255,.08);transform:translateY(-1px)}.drop .icon{font-size:2.6rem;margin-bottom:10px}.drop strong{display:block;font-size:1.08rem}.drop span{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}input[type=file]{display:none}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:20px 0}.quality{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.9rem}.quality select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 16px;background:var(--panel);color:var(--text);font:600 .9rem inherit;cursor:pointer}.btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}.btn.primary{border:0;background:linear-gradient(100deg,#d929b2,#138fe5);color:white}.btn:disabled{opacity:.42;cursor:not-allowed}.list{display:grid;gap:10px}.file-row{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:var(--muted);font-size:.78rem;margin-top:2px}.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.btn.small{padding:5px 12px;font-size:.78rem}.info-panel{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}.info-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;font-size:.83rem;margin:0}.info-grid dt{color:var(--muted)}.info-grid dd{margin:0;overflow-wrap:anywhere}.info-section{color:var(--cyan);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin:12px 0 6px}.info-section:first-child{margin-top:0}.info-raw{margin-top:12px}.info-raw summary{cursor:pointer;color:var(--muted);font-size:.78rem}.info-raw pre{margin-top:8px;background:#05070c;border:1px solid var(--line);border-radius:8px;padding:11px;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a8f4ff;overflow:auto;max-height:230px;white-space:pre-wrap}.status{text-align:right;color:var(--muted);font-size:.84rem}.status.ok{color:var(--green)}.status.err{color:var(--danger)}.status a{color:var(--cyan);font-weight:650;text-decoration:none}.status a:hover{text-decoration:underline}.bar{height:4px;border-radius:99px;background:#283148;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .2s}.log-wrap{margin-top:25px}.log-label{color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}.log{height:150px;overflow:auto;background:#05070c;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a8f4ff;white-space:pre-wrap}.log .err{color:var(--danger)}.log .ok{color:var(--green)}.results{margin-top:26px}.result-list{display:grid;gap:16px}.result-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}.result-card video{width:100%;max-height:340px;border-radius:9px;background:#000;display:block}.result-info{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.result-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-meta{color:var(--muted);font-size:.78rem;margin-top:3px}.hint{text-align:center;color:#59657e;font-size:.78rem;margin-top:24px}.hint .why{display:inline-block;margin-top:9px;color:var(--cyan);text-decoration:none;font-size:.84rem;font-weight:600}.hint .why:hover{text-decoration:underline}@media(max-width:720px){header{flex-direction:column;gap:12px}header .logo-link{position:static;transform:none}header .info-link{position:static;transform:none}header img.site-logo{max-width:100%}}@media(max-width:600px){body{padding:25px 12px 45px}.file-row{grid-template-columns:1fr}.status{text-align:left}.row-side{align-items:flex-start}.toolbar{align-items:stretch}.actions{width:100%}.actions .btn{flex:1}.result-info{flex-direction:column;align-items:stretch}.result-info .btn{width:100%}}
</style>
</head>
<body>
<main>
<header>
  <div id="ffmpegBar" style="position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0%;transition:width .3s;display:none"></div>
  <a href="index.html" class="logo-link" title="DZ Video Stitcher"><img src="DZ_logo.png" alt="DZ Video Stitcher"></a>
  <img class="site-logo" src="DZ-Video-Converter.png" alt="DZ Video-Converter">
  <a class="info-link" href="h264mp4.html">Why H.264 MP4?</a>
</header>
<div id="drop" class="drop" role="button" tabindex="0"><div class="icon">↥</div><strong>DZ DROP-ZONE</strong><span>or click to browse · MP4, MOV, MKV, AVI, WebM and more</span></div>
<input id="fileInput" type="file" accept="video/*" multiple>
<div id="fileList" class="list" aria-live="polite"></div>
<div class="toolbar"><label class="quality">Quality <select id="crf" aria-label="Encoding quality"><option value="16">Highest · CRF 16</option><option value="18" selected>Recommended · CRF 18</option><option value="20">Smaller · CRF 20</option></select></label><div class="actions"><button id="clearBtn" class="btn" type="button" disabled>Clear</button><button id="convertBtn" class="btn primary" type="button" disabled>Convert all</button></div></div>
<section class="log-wrap"><div class="log-label">Progress log</div><div id="log" class="log" role="log" aria-live="polite">Ready. Add one or more video files to begin.</div></section>
<section id="results" class="results" hidden><div class="log-label">Converted videos</div><div id="resultList" class="result-list"></div></section>
<div class="hint">H.264 · High Profile · yuv420p · AAC 192k · 48 kHz · fast start<br><a class="why" href="h264mp4.html">DZ Video-Converter converts files to H.264 .MP4</a></div>
</main>
<script type="module">
import {FFmpeg} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import {fetchFile} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';
const $=id=>document.getElementById(id);
const drop=$('drop'), input=$('fileInput'), list=$('fileList'), logBox=$('log'), convert=$('convertBtn'), clear=$('clearBtn'), crf=$('crf');
const results=$('results'), resultList=$('resultList');
const state=[], done=[]; let engine=null, loading=null, busy=false;
/* Chromium-based browsers can open a real "Save as" dialog; everything else
   falls back to a normal download into the browser's download folder. */
const canPickFolder=typeof window.showSaveFilePicker==='function';
/* @ffmpeg/ffmpeg always spawns its worker with {type:'module'}, so the core it
   imports must be the ESM build — the UMD build has no default export and the
   load fails with "failed to import ffmpeg-core.js". */
const PKG='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm';
const CORE='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
async function blobURL(url,type){const res=await fetch(url);if(!res.ok)throw new Error(url.split('/').pop()+' failed to download (HTTP '+res.status+')');return URL.createObjectURL(new Blob([await res.arrayBuffer()],{type}))}
/* ── File inspection ──────────────────────────────────────────────────────
   ffmpeg -i with no output prints everything it knows about a file, so the
   report is captured from the engine log rather than sent to the page log. */
const capture={on:false,lines:[]};
async function probe(source,label){await loadEngine();const name='probe'+ext(label);capture.on=true;capture.lines=[];try{await engine.writeFile(name,await fetchFile(source));try{await engine.exec(['-hide_banner','-i',name])}catch(e){/* no output file: expected */}await engine.deleteFile(name).catch(()=>{})}finally{capture.on=false}return capture.lines.join('\n').trim()}
function parseProbe(text){const info={streams:[],tags:[]};const container=text.match(/Input #0,\s*([^,]+(?:,[^,]+)*),\s*from/);if(container)info.container=container[1].trim();const dur=text.match(/Duration:\s*([0-9:.]+|N\/A)/);if(dur&&dur[1]!=='N/A')info.duration=dur[1];const rate=text.match(/bitrate:\s*([^\n,]+)/);if(rate)info.bitrate=rate[1].trim();for(const line of text.split('\n')){const s=line.match(/Stream #\d+:\d+(?:\[[^\]]*\])?(?:\(([^)]*)\))?:\s*(Video|Audio|Subtitle|Data):\s*(.+)/);if(s)info.streams.push({lang:s[1]||'',kind:s[2],detail:s[3].trim()});const t=line.match(/^\s{4}([A-Za-z_][\w-]*)\s*:\s*(.+)$/);if(t&&!/^(Duration|Stream|Metadata|Side data|encoder)$/i.test(t[1])&&t[2].trim())info.tags.push([t[1],t[2].trim()])}
const v=info.streams.find(s=>s.kind==='Video');if(v){const dim=v.detail.match(/(\d{2,5})x(\d{2,5})/);if(dim)info.resolution=dim[1]+' × '+dim[2];const fps=v.detail.match(/([\d.]+)\s*fps/);if(fps)info.fps=fps[1]+' fps';const codec=v.detail.match(/^([\w.]+)(?:\s*\(([^)]+)\))?/);if(codec)info.vcodec=codec[1]+(codec[2]&&!/^[\da-fx/ ]+$/i.test(codec[2])?' ('+codec[2]+')':'');const pix=v.detail.match(/\b(yuv[\w]+|rgb[\w]*|gbr[\w]*|nv\d+|pal8)\b/);if(pix)info.pixfmt=pix[1];const dar=v.detail.match(/DAR ([\d:]+)/);if(dar)info.aspect=dar[1]}
const a=info.streams.find(s=>s.kind==='Audio');if(a){const codec=a.detail.match(/^([\w.]+)(?:\s*\(([^)]+)\))?/);if(codec)info.acodec=codec[1]+(codec[2]&&!/^[\da-fx/ ]+$/i.test(codec[2])?' ('+codec[2]+')':'');const hz=a.detail.match(/(\d+)\s*Hz/);if(hz)info.samplerate=Number(hz[1]).toLocaleString()+' Hz';const ch=a.detail.match(/\b(mono|stereo|5\.1[\w()]*|7\.1[\w()]*|quad|\d+ channels)\b/);if(ch)info.channels=ch[1]}
return info}
function infoPanel(raw,file){const wrap=document.createElement('div');wrap.className='info-panel';const info=parseProbe(raw);const rows=[];rows.push(['section','File']);rows.push(['Name',file.name]);rows.push(['Size',size(file.size)+' ('+file.size.toLocaleString()+' bytes)']);if(file.type)rows.push(['MIME type',file.type]);if(file.lastModified)rows.push(['Modified',new Date(file.lastModified).toLocaleString()]);
if(info.container||info.duration||info.bitrate){rows.push(['section','Container']);if(info.container)rows.push(['Format',info.container]);if(info.duration)rows.push(['Duration',info.duration]);if(info.bitrate)rows.push(['Overall bitrate',info.bitrate])}
if(info.vcodec||info.resolution){rows.push(['section','Video']);if(info.vcodec)rows.push(['Codec',info.vcodec]);if(info.resolution)rows.push(['Resolution',info.resolution]);if(info.aspect)rows.push(['Display aspect',info.aspect]);if(info.fps)rows.push(['Frame rate',info.fps]);if(info.pixfmt)rows.push(['Pixel format',info.pixfmt])}
if(info.acodec){rows.push(['section','Audio']);rows.push(['Codec',info.acodec]);if(info.samplerate)rows.push(['Sample rate',info.samplerate]);if(info.channels)rows.push(['Channels',info.channels])}
const extra=info.streams.filter(s=>s.kind==='Subtitle'||s.kind==='Data');if(extra.length){rows.push(['section','Other streams']);extra.forEach((s,i)=>rows.push([s.kind+(s.lang?' ('+s.lang+')':''),s.detail]))}
if(info.tags.length){rows.push(['section','Metadata']);info.tags.slice(0,12).forEach(([k,v])=>rows.push([k,v]))}
let dl=null;for(const [k,v] of rows){if(k==='section'){const h=document.createElement('div');h.className='info-section';h.textContent=v;wrap.append(h);dl=document.createElement('dl');dl.className='info-grid';wrap.append(dl);continue}const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd)}
const details=document.createElement('details');details.className='info-raw';const summary=document.createElement('summary');summary.textContent='Raw ffmpeg output';const pre=document.createElement('pre');pre.textContent=raw||'(no output)';details.append(summary,pre);wrap.append(details);return wrap}
function log(message,kind=''){if(capture.on){capture.lines.push(message);return}const line=document.createElement('div');if(kind)line.className=kind;line.textContent=message;logBox.append(line);logBox.scrollTop=logBox.scrollHeight}
function ext(name){const m=name.match(/\.[^.]+$/);return m?m[0]:'.mp4'}
function stem(name){return name.replace(/\.[^.]+$/,'')}
function size(n){return n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
function render(){list.replaceChildren();state.forEach((item,i)=>{const row=document.createElement('div');row.className='file-row';row.innerHTML='<div><div class="name"></div><div class="meta"></div><div class="bar"><i></i></div></div><div class="row-side"><div class="status"></div><button class="btn small" type="button"></button></div>';row.querySelector('.name').textContent=item.file.name;row.querySelector('.meta').textContent=size(item.file.size)+(item.file.type?' · '+item.file.type:'');const status=row.querySelector('.status');status.textContent=item.status||'Pending';if(item.done)status.className='status ok';else if(item.error)status.className='status err';row.querySelector('i').style.width=(item.progress||0)+'%';const btn=row.querySelector('button');btn.textContent=item.probing?'Reading…':item.open?'Hide info':'Info';btn.disabled=!!item.probing||busy;btn.addEventListener('click',()=>toggleInfo(item,item.file,item.file.name,render));row.dataset.index=i;list.append(row);if(item.open&&item.info!=null)row.append(infoPanel(item.info,item.file))});convert.disabled=!state.length||busy;clear.disabled=!state.length||busy}
async function toggleInfo(item,source,label,rerender){if(item.info!=null){item.open=!item.open;rerender();return}item.probing=true;rerender();try{item.info=await probe(source,label);item.open=true}catch(e){log('Could not read '+label+': '+(e.message||e),'err')}finally{item.probing=false;rerender()}}
function renderResults(){resultList.replaceChildren();results.hidden=!done.length;done.forEach((item,i)=>{const card=document.createElement('div');card.className='result-card';card.dataset.result=i;card.innerHTML='<video controls preload="metadata" playsinline></video><div class="result-info"><div><div class="result-name"></div><div class="result-meta"></div></div><div class="actions"><button class="btn small" type="button"></button><button class="btn primary" type="button">'+(canPickFolder?'Save as…':'Download')+'</button></div></div>';card.querySelector('video').src=item.url;card.querySelector('.result-name').textContent=item.name;card.querySelector('.result-meta').textContent=size(item.blob.size)+' · from '+item.source;const [infoBtn,saveBtn]=card.querySelectorAll('button');infoBtn.textContent=item.probing?'Reading…':item.open?'Hide info':'Info';infoBtn.disabled=!!item.probing||busy;infoBtn.addEventListener('click',()=>toggleInfo(item,item.blob,item.name,renderResults));saveBtn.addEventListener('click',()=>save(item));resultList.append(card);if(item.open&&item.info!=null)card.append(infoPanel(item.info,{name:item.name,size:item.blob.size,type:item.blob.type}))})}
async function save(item){
  if(canPickFolder){
    let handle=null;
    try{handle=await window.showSaveFilePicker({suggestedName:item.name,types:[{description:'MP4 video',accept:{'video/mp4':['.mp4']}}]})}
    catch(e){if(e.name==='AbortError')return;log('Save dialog unavailable ('+(e.message||e)+') — using your download folder instead.')}
    if(handle){try{const writable=await handle.createWritable();await writable.write(item.blob);await writable.close();log('Saved '+item.name,'ok')}catch(e){log('Could not save '+item.name+': '+(e.message||e),'err')}return}
  }
  const a=document.createElement('a');a.href=item.url;a.download=item.name;document.body.append(a);a.click();a.remove();log('Downloaded '+item.name+' to your download folder.','ok')
}
function add(files){for(const file of files){if(file.type.startsWith('video/')||/\.(mp4|mov|mkv|avi|webm|wmv|flv|m4v|mpeg|mpg)$/i.test(file.name))state.push({file,status:'Pending',progress:0})}render()}
async function loadEngine(){if(engine?.loaded)return;if(loading)return loading;loading=(async()=>{log('Loading ffmpeg.wasm core…');engine=new FFmpeg();engine.on('log',({message})=>{if(!message.includes('Aborted()'))log(message)});engine.on('progress',({progress})=>{if(window.currentIndex==null)return;state[window.currentIndex].progress=Math.max(0,Math.min(100,Math.round(progress*100)));render()});/* The Worker constructor rejects a cross-origin URL, so point it at a same-origin
   blob that re-imports worker.js from the CDN — module workers may import cross-origin. */
const classWorkerURL=URL.createObjectURL(new Blob(["import '"+PKG+"/worker.js';"],{type:'text/javascript'}));const [coreURL,wasmURL]=await Promise.all([blobURL(CORE+'/ffmpeg-core.js','text/javascript'),blobURL(CORE+'/ffmpeg-core.wasm','application/wasm')]);await engine.load({coreURL,wasmURL,classWorkerURL});URL.revokeObjectURL(classWorkerURL);log('ffmpeg.wasm ready.','ok')})().catch(e=>{engine=null;log('Load error: '+(e.message||e),'err');throw e}).finally(()=>{loading=null});return loading}
async function convertAll(){if(busy||!state.length)return;busy=true;render();try{await loadEngine();for(let i=0;i<state.length;i++){window.currentIndex=i;const item=state[i],file=item.file;item.status='Converting…';item.progress=0;render();log('\n— Converting '+file.name+' —');const inName='input_'+i+ext(file.name),outName='normalized_'+i+'.mp4';try{await engine.writeFile(inName,await fetchFile(file));await engine.exec(['-i',inName,'-c:v','libx264','-profile:v','high','-pix_fmt','yuv420p','-crf',crf.value,'-preset','medium','-c:a','aac','-b:a','192k','-ar','48000','-movflags','+faststart',outName]);const data=await engine.readFile(outName);const blob=new Blob([data],{type:'video/mp4'});item.status='Converted ✅';item.done=true;item.progress=100;await engine.deleteFile(inName);await engine.deleteFile(outName);done.push({blob,url:URL.createObjectURL(blob),name:stem(file.name)+'_normalized.mp4',source:file.name});render();renderResults();log('Finished '+file.name,'ok')}catch(e){item.status='Error ❌';item.error=e.message||String(e);render();log('Error converting '+file.name+': '+item.error,'err')}}log('\nAll conversions complete. Use the buttons below to save them.','ok')}catch(e){}finally{window.currentIndex=null;busy=false;render();renderResults()}}
drop.addEventListener('click',()=>input.click());drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')input.click()});['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>add(e.dataTransfer.files));input.addEventListener('change',e=>{add(e.target.files);input.value='' });clear.addEventListener('click',()=>{done.forEach(x=>URL.revokeObjectURL(x.url));done.length=0;state.length=0;render();renderResults();logBox.textContent='Ready. Add one or more video files to begin.'});convert.addEventListener('click',convertAll);
</script></body>
</html>
