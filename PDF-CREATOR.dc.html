<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    a { color: #5980a6; }
    a:hover { color: #416180; }
    ::selection { background: rgba(89,128,166,0.3); }
  </style>
</helmet>
<div style="min-height:100vh; background:#fff; font-family:'Barlow',system-ui,sans-serif; color:#1d1f20; display:flex; justify-content:center; padding:{{ outerPadding }}; font-size:15px;">
  <div style="max-width:900px; width:100%;">
    <dc-import name="Notepad" hint-size="100%,60px" storage-key="sharedNotepad"></dc-import>

<div style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:22px; letter-spacing:0.02em; text-transform:uppercase; color:#1d1f20; margin:2px 0 10px; text-align:center;">PDF-CREATOR</div>

<dc-import name="DropBox" hint-size="100%,165px"
      headline="DROP-BOX"
      box-padding="16px 20px"
      box-margin-bottom="6px"
      file-types-label="PDF, TXT, JPG, PNG, WebP, GIF, BMP, SVG, AVIF"
      accept-types=".pdf,.txt,image/*"
      allow-multiple="{{ true }}"
      url-placeholder="Or paste a PDF/image URL…"
      drop-border-color="{{ dropBorderColor }}"
      drop-bg="{{ dropBg }}"
      on-drag-over="{{ onDragOver }}"
      on-drag-leave="{{ onDragLeave }}"
      on-drop="{{ onDrop }}"
      on-dropzone-click="{{ onDropzoneClick }}"
      file-input-ref="{{ fileInputRef }}"
      on-file-input="{{ onFileInput }}"
      url-input="{{ urlInput }}"
      on-url-input-change="{{ onUrlInputChange }}"
      load-from-url="{{ loadFromUrl }}"
      stop-propagation="{{ stopPropagation }}"
      on-paste-click="{{ onPasteClick }}"
    ></dc-import>    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px; min-height:44px;">
        <button onClick="{{ clearPage }}" title="Clear the file list" style="border:none; background:none; padding:12px 6px; min-height:44px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px; color:#1d1f20; text-transform:uppercase; white-space:nowrap;" style-hover="color:#8a2c2c;">CLICK TO CLEAR DROP-BOX</button>
      </div>
    </sc-if>
    
    
    

    <div style="position:relative; border:1px solid rgba(29,31,32,0.16); background:#fff; margin-top:2px; margin-bottom:0; display:flex; flex-direction:column; min-height:180px;">
      <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(29,31,32,0.6); padding:14px 14px 0; margin-bottom:8px;">Preview window</div>
      <sc-if value="{{ noItems }}" hint-placeholder-val="{{ true }}">
        <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:0 14px 14px;">
          <div style="font-size:13px; color:rgba(29,31,32,0.45); text-align:center;">Your document pages will display in this window</div>
        </div>
      </sc-if>
      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:10px; padding:0 14px 14px;">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="0">
            <div
              draggable="{{ true }}"
              onDragStart="{{ item.onDragStart }}"
              onDragOver="{{ preventDefault }}"
              onDrop="{{ item.onDrop }}"
              style="background:#fff; border:1px solid rgba(29,31,32,0.16); padding:10px; display:flex; align-items:center; gap:10px; cursor:grab;"
            >
              <div style="color:rgba(29,31,32,0.4); font-size:16px; user-select:none;">☰</div>
              <input type="checkbox" checked="{{ item.included }}" onChange="{{ item.toggleIncluded }}" style="width:17px; height:17px; cursor:pointer; accent-color:#5980a6;" />
              <div style="width:64px; height:{{ item.previewHeight }}; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid rgba(29,31,32,0.16); overflow:hidden; position:relative; font-size:10px; color:rgba(29,31,32,0.55);">
                <sc-if value="{{ item.hasObjectUrl }}" hint-placeholder-val="{{ false }}"><img src="{{ item.objectUrl }}" style="width:100%; height:100%; object-fit:contain; display:block;" /></sc-if>
                <sc-if value="{{ item.isPdf }}" hint-placeholder-val="{{ false }}"><div style="font-weight:700; color:#5980a6; font-size:12px;">PDF</div></sc-if>
                <sc-if value="{{ item.isText }}" hint-placeholder-val="{{ false }}"><div style="padding:4px; font-size:9px; line-height:1.2; overflow:hidden;">{{ item.snippet }}</div></sc-if>
                <div style="position:absolute; bottom:2px; right:2px; font-size:9px; background:rgba(29,31,32,0.75); color:#f2f2f3; padding:1px 4px;">{{ item.pageLabel }}</div>
              </div>
              <div style="flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;">
                <div style="font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ item.name }}</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                  <select value="{{ item.pageSize }}" onChange="{{ item.setPageSize }}" style="font-size:12px; padding:4px 6px; border:1px solid rgba(29,31,32,0.16); background:#fff; cursor:pointer;">
                    <option value="8.5x11">8.5×11</option>
                    <option value="11x17">11×17</option>
                  </select>
                  <select value="{{ item.orientation }}" onChange="{{ item.setOrientation }}" style="font-size:12px; padding:4px 6px; border:1px solid rgba(29,31,32,0.16); background:#fff; cursor:pointer;">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                  </select>
                  <span style="font-size:10px; padding:2px 8px; background:#eef6ff; color:#2c455d;">{{ item.typeLabel }}</span>
                </div>
              </div>
              <button onClick="{{ item.remove }}" title="Remove" style="background:none; border:none; color:rgba(29,31,32,0.4); font-size:20px; cursor:pointer; line-height:1;" style-hover="color:#8a2c2c;">×</button>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="border:1px solid rgba(29,31,32,0.16); padding:14px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:0;">
      <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(29,31,32,0.6); flex-basis:100%;">Filename</div>
      <input
        type="text"
        value="{{ filename }}"
        onChange="{{ onFilenameChange }}"
        onFocus="{{ onFilenameFocus }}"
        onBlur="{{ onFilenameBlur }}"
        spellCheck="false"
        style="flex:1; min-width:220px; font-family:'Courier New',monospace; font-size:13px; color:#1d1f20; background:#fff; padding:8px 10px; border:1px solid rgba(29,31,32,0.16); border-radius:0;"
      />
    </div>
    <dc-import name="SaveBox" hint-size="100%,60px"
      is-mobile="{{ isMobile }}"
      label="Resolution"
      radio-name="creatorDpi"
      options="{{ dpiOptions }}"
      show-button="{{ true }}"
      button-label="{{ generateLabel }}"
      on-button-click="{{ generate }}"
      button-disabled="{{ generateDisabled }}"
      button-cursor="{{ generateCursor }}"
      button-opacity="{{ generateOpacity }}"
    ></dc-import>

    <dc-import name="ToolHeader" activeTool="PDF-CREATOR" on-clear="{{ clearPage }}" clear-label="CLICK TO CLEAR DROP-BOX" hint-size="100%,120px"></dc-import>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    items: [],
    textInput: '',
    filename: '',
    userEditedFilename: false,
    filenameFocused: false,
    generating: false,
    dragOver: false,
    urlInput: '',
    dpi: '300',
    isMobile: typeof window !== 'undefined' && window.innerWidth < 640,
  };

  fileInputRef = React.createRef();
  seqNum = 1;
  fileCounter = 1;
  setDpi150 = () => this.setState({ dpi: '150' }, () => this.persist());
  setDpi300 = () => this.setState({ dpi: '300' }, () => this.persist());
  textCounter = 1;
  itemIdCounter = 1;
  draggingId = null;
  lastMinuteKey = '';
  interval = null;

  STORAGE_KEY = 'pdfCreatorState_v1';

  bufToBase64(buf) {
    const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return btoa(binary);
  }

  base64ToUint8(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  persist() {
    try {
      const { items, filename, dpi, userEditedFilename } = this.state;
      const serItems = items.map((i) => {
        const { objectUrl, ...rest } = i;
        if (rest.data) rest.data = this.bufToBase64(rest.data);
        return rest;
      });
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ items: serItems, filename, dpi, userEditedFilename, fileCounter: this.fileCounter, textCounter: this.textCounter, itemIdCounter: this.itemIdCounter }));
    } catch (err) { console.warn('Persist failed', err); }
  }

  loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      const items = (data.items || []).map((i) => {
        const item = { ...i };
        if (item.data) item.data = this.base64ToUint8(item.data).buffer;
        if (item.type === 'image' && item.data) {
          const blob = new Blob([item.data], { type: item.imageType === 'jpg' ? 'image/jpeg' : 'image/png' });
          item.objectUrl = URL.createObjectURL(blob);
        }
        return item;
      });
      this.fileCounter = data.fileCounter || this.fileCounter;
      this.textCounter = data.textCounter || this.textCounter;
      this.itemIdCounter = data.itemIdCounter || this.itemIdCounter;
      this.setState({ items, filename: data.filename || this.state.filename, dpi: data.dpi || this.state.dpi, userEditedFilename: !!data.userEditedFilename });
    } catch (err) { console.warn('Load failed', err); }
  }

  clearPage = () => {
    if (!confirm('Clear all dropped files and inputs? This cannot be undone.')) return;
    this.state.items.forEach((i) => { if (i.objectUrl) URL.revokeObjectURL(i.objectUrl); });
    localStorage.removeItem(this.STORAGE_KEY);
    this.setState({ items: [], userEditedFilename: false, filename: this.buildAutoName(), dpi: '300' });
  };

  componentDidMount() {
    this.loadFromStorage();
    if (!this.state.userEditedFilename) this.setState({ filename: this.buildAutoName() });
    this.consumeHandoff();
    this.interval = setInterval(() => {
      if (!this.state.userEditedFilename && !this.state.filenameFocused) {
        this.setState({ filename: this.buildAutoName() });
      }
    }, 2000);
    this.pasteHandler = (e) => this.handlePaste(e);
    document.addEventListener('paste', this.pasteHandler);
    this._blockNav = (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; };
    window.addEventListener('dragover', this._blockNav);
    window.addEventListener('drop', this._blockNav);
    this._onResize = () => {
      const isMobile = window.innerWidth < 640;
      if (isMobile !== this.state.isMobile) this.setState({ isMobile });
    };
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    clearInterval(this.interval);
    document.removeEventListener('paste', this.pasteHandler);
    window.removeEventListener('dragover', this._blockNav);
    window.removeEventListener('drop', this._blockNav);
    window.removeEventListener('resize', this._onResize);
  }

  componentDidUpdate() {}

  pad(n) { return String(n).padStart(2, '0'); }

  buildAutoName() {
    const now = new Date();
    const minuteKey = `${now.getFullYear()}${this.pad(now.getMonth() + 1)}${this.pad(now.getDate())}${this.pad(now.getHours())}${this.pad(now.getMinutes())}`;
    if (minuteKey !== this.lastMinuteKey) {
      this.lastMinuteKey = minuteKey;
      this.seqNum = 1;
    }
    const datePart = minuteKey.slice(0, 8);
    const timePart = minuteKey.slice(8);
    const suffix = this.seqNum > 1 ? String(this.seqNum).padStart(2, '0') : '';
    return `${datePart}-${timePart}h${suffix}.PDF`;
  }

  async consumeHandoff() {
    try {
      const raw = localStorage.getItem('pdfImageManagerHandoff');
      if (!raw) return;
      localStorage.removeItem('pdfImageManagerHandoff');
      const data = JSON.parse(raw);
      for (const f of (data.files || [])) {
        const blob = await (await fetch(f.dataUrl)).blob();
        await this.processFile(new File([blob], f.name, { type: f.type }));
      }
    } catch (err) { console.warn('Handoff load failed', err); }
  }

  onFilenameChange = (e) => this.setState({ filename: e.target.value, userEditedFilename: true }, () => this.persist());
  onFilenameFocus = () => this.setState({ filenameFocused: true });
  onFilenameBlur = () => this.setState({ filenameFocused: false });

  onDropzoneClick = () => this.fileInputRef.current && this.fileInputRef.current.click();
  onDragOver = (e) => { e.preventDefault(); this.setState({ dragOver: true }); };
  onDragLeave = (e) => { e.preventDefault(); this.setState({ dragOver: false }); };
  onDrop = (e) => {
    e.preventDefault();
    this.setState({ dragOver: false });
    Array.from(e.dataTransfer.files).forEach((f) => this.processFile(f));
  };
  onFileInput = (e) => {
    Array.from(e.target.files).forEach((f) => this.processFile(f));
    e.target.value = '';
  };

  stopPropagation = (e) => e.stopPropagation();
  onUrlInputChange = (e) => this.setState({ urlInput: e.target.value });

  onPasteClick = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/')) {
              const blob = await item.getType(type);
              const ext = type.split('/')[1] || 'png';
              this.processFile(new File([blob], `pasted_image.${ext}`, { type }));
              return;
            }
          }
        }
      }
      alert('Clipboard access denied or no image found. Try pressing Ctrl+V instead.');
    } catch (err) {
      alert('Could not read clipboard. Try pressing Ctrl+V instead.');
    }
  };

  async loadFromUrl() {
    const url = (this.state.urlInput || '').trim();
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const name = (url.split('/').pop() || 'file').split('?')[0] || 'file';
      this.setState({ urlInput: '' });
      this.processFile(new File([blob], name, { type: blob.type || 'application/octet-stream' }));
    } catch (err) {
      alert('Could not load that URL (it may block cross-origin access): ' + err.message);
    }
  }

  async processFile(file) {
    if (file.type === 'application/pdf') {
      this.addItem({ id: this.itemIdCounter++, type: 'pdf', name: 'FILE ' + this.fileCounter++, data: await file.arrayBuffer(), pageSize: '8.5x11', orientation: 'portrait', included: true });
    } else if (file.type.startsWith('image/')) {
      await this.processImageFile(file);
    } else if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
      this.addItem({ id: this.itemIdCounter++, type: 'text', name: 'FILE ' + this.fileCounter++, content: await file.text(), pageSize: '8.5x11', orientation: 'portrait', included: true });
    } else {
      this.setState({}); // no-op, unsupported
      alert('Unsupported file type: ' + file.name);
    }
  }

  async processImageFile(file, customName) {
    const name = customName || ('FILE ' + this.fileCounter++);
    if (file.type === 'image/jpeg' || file.type === 'image/png') {
      const data = new Uint8Array(await file.arrayBuffer());
      this.addItem({ id: this.itemIdCounter++, type: 'image', name, data, imageType: file.type === 'image/jpeg' ? 'jpg' : 'png', pageSize: '8.5x11', orientation: 'portrait', included: true });
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await new Promise((r) => { img.onload = r; });
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
    const data = new Uint8Array(await blob.arrayBuffer());
    this.addItem({ id: this.itemIdCounter++, type: 'image', name, data, imageType: 'png', pageSize: '8.5x11', orientation: 'portrait', included: true });
    URL.revokeObjectURL(url);
  }

  addItem(item) {
    if (item.type === 'image') {
      const blob = new Blob([item.data], { type: item.imageType === 'jpg' ? 'image/jpeg' : 'image/png' });
      item.objectUrl = URL.createObjectURL(blob);
    }
    this.setState((s) => ({ items: [...s.items, item] }), () => this.persist());
  }

  handleAddText = () => {
    const text = this.state.textInput.trim();
    if (!text) return;
    const label = 'INPUT ' + this.textCounter++;
    this.addItem({ id: this.itemIdCounter++, type: 'text', name: label, content: text, pageSize: '8.5x11', orientation: 'portrait', included: true });
    this.setState({ textInput: '' });
  };

  onTextInputChange = (e) => this.setState({ textInput: e.target.value });

  async handlePaste(e) {
    if (!e.clipboardData) return;
    for (const item of e.clipboardData.items) {
      if (item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (file) {
          const label = 'FILE ' + this.fileCounter++;
          await this.processImageFile(file, label);
        }
      }
    }
  }

  removeItem(id) {
    this.setState((s) => {
      const item = s.items.find((i) => i.id === id);
      if (item && item.objectUrl) URL.revokeObjectURL(item.objectUrl);
      return { items: s.items.filter((i) => i.id !== id) };
    }, () => this.persist());
  }

  toggleIncluded(id, checked) {
    this.setState((s) => ({ items: s.items.map((i) => (i.id === id ? { ...i, included: checked } : i)) }), () => this.persist());
  }

  setPageSize(id, val) {
    this.setState((s) => ({ items: s.items.map((i) => (i.id === id ? { ...i, pageSize: val } : i)) }), () => this.persist());
  }

  setOrientation(id, val) {
    this.setState((s) => ({ items: s.items.map((i) => (i.id === id ? { ...i, orientation: val } : i)) }), () => this.persist());
  }

  onDragStart(id, e) {
    this.draggingId = id;
    e.dataTransfer.setData('text/plain', String(id));
  }

  onDropItem(targetId) {
    const fromId = this.draggingId;
    if (fromId == null || fromId === targetId) return;
    this.setState((s) => {
      const items = [...s.items];
      const fromIdx = items.findIndex((i) => i.id === fromId);
      const toIdx = items.findIndex((i) => i.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return {};
      const [moved] = items.splice(fromIdx, 1);
      items.splice(toIdx, 0, moved);
      return { items };
    }, () => this.persist());
    this.draggingId = null;
  }

  async generate() {
    if (this.state.generating || this.state.items.filter((i) => i.included).length === 0) return;
    this.setState({ generating: true });
    try {
      const { generatePDF } = await import('./pdfEngine.js');
      const filename = (this.state.filename || '').trim() || this.buildAutoName();
      await generatePDF(this.state.items, filename);
      this.seqNum++;
      this.setState({ userEditedFilename: false, filename: this.buildAutoName() });
    } catch (err) {
      console.error(err);
      alert(err.message || 'Error generating PDF');
    } finally {
      this.setState({ generating: false });
    }
  }

  onMobileNav = (e) => { const v = e.target.value; if (v) window.location.href = v; };

  renderVals() {
    const { items, textInput, filename, generating, dragOver, isMobile, dpi } = this.state;
    const includedCount = items.filter((i) => i.included).length;
    const disabled = generating || includedCount === 0;
    const getDims = (size, orientation) => {
      const sizes = { '8.5x11': { w: 612, h: 792 }, '11x17': { w: 792, h: 1224 } };
      const s = sizes[size] || sizes['8.5x11'];
      return orientation === 'landscape' ? { w: s.h, h: s.w } : { w: s.w, h: s.h };
    };
    return {
      isMobile,
      isDesktopHeader: !isMobile,
      onMobileNav: this.onMobileNav,
      textInput, filename,
      outerPadding: isMobile ? '10px 14px 28px' : '18px 24px 56px',
      headerGridCols: isMobile ? '1fr' : 'auto 1fr auto',
      navJustify: isMobile ? 'center' : 'flex-start',
      navFlexWrap: isMobile ? 'wrap' : 'nowrap',
      titleWhiteSpace: isMobile ? 'normal' : 'nowrap',
      titleFontSize: isMobile ? 22 : 26,
      headerLogoSize: isMobile ? 56 : 80,
      noItems: items.length === 0,
      hasItems: items.length > 0,
      dropBorderColor: dragOver ? '#5980a6' : 'rgba(29,31,32,0.16)',
      dropBg: dragOver ? '#eef6ff' : '#f2f2f3',
      fileInputRef: this.fileInputRef,
      onDropzoneClick: this.onDropzoneClick,
      onDragOver: this.onDragOver,
      onDragLeave: this.onDragLeave,
      onDrop: this.onDrop,
      onFileInput: this.onFileInput,
      urlInput: this.state.urlInput,
      onUrlInputChange: this.onUrlInputChange,
      loadFromUrl: () => this.loadFromUrl(),
      stopPropagation: this.stopPropagation,
      onPasteClick: this.onPasteClick,
      onFilenameChange: this.onFilenameChange,
      onFilenameFocus: this.onFilenameFocus,
      onFilenameBlur: this.onFilenameBlur,
      onTextInputChange: this.onTextInputChange,
      handleAddText: this.handleAddText,
      preventDefault: (e) => e.preventDefault(),
      generateDisabled: disabled,
      generateCursor: disabled ? 'not-allowed' : 'pointer',
      generateOpacity: disabled ? 0.45 : 1,
      generateLabel: generating ? 'WORKING…' : 'PDF-FLATTEN / SAVE',
      dpiOptions: [
        { label: '150 DPI (smaller file)', checked: dpi === '150', onSelect: this.setDpi150 },
        { label: '300 DPI (print quality)', checked: dpi === '300', onSelect: this.setDpi300 },
      ].map((o) => ({ ...o, bg: o.checked ? '#5980a6' : 'transparent', color: o.checked ? '#f2f2f3' : '#1d1f20' })),
      generate: () => this.generate(),
      clearPage: this.clearPage,
      items: items.map((item) => {
        const dims = getDims(item.pageSize, item.orientation);
        const aspect = dims.w / dims.h;
        const previewHeight = Math.round(64 / aspect) + 'px';
        const snippet = item.type === 'text' ? item.content.replace(/\n/g, ' ').slice(0, 60) + (item.content.length > 60 ? '…' : '') : '';
        return {
          ...item,
          objectUrl: item.objectUrl || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==',
          hasObjectUrl: !!item.objectUrl,
          previewHeight,
          isImage: item.type === 'image',
          isPdf: item.type === 'pdf',
          isText: item.type === 'text',
          snippet,
          typeLabel: item.type.toUpperCase(),
          pageLabel: `${item.pageSize} ${item.orientation[0].toUpperCase()}`,
          toggleIncluded: (e) => this.toggleIncluded(item.id, e.target.checked),
          setPageSize: (e) => this.setPageSize(item.id, e.target.value),
          setOrientation: (e) => this.setOrientation(item.id, e.target.value),
          remove: () => this.removeItem(item.id),
          onDragStart: (e) => this.onDragStart(item.id, e),
          onDrop: (e) => { e.preventDefault(); this.onDropItem(item.id); },
        };
      }),
    };
  }
}
</script>
</body>
</html>
