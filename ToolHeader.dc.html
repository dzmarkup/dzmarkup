<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ showWide }}" hint-placeholder-val="{{ true }}">
  <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:20px; margin-bottom:0;">
    <div style="display:flex; align-items:center; gap:14px; flex-shrink:0; justify-self:start;">
      <img src="{{ selfAssetSrc }}" title="{{ selfTitle }}" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
      <a href="./PDF-IMG-MGR.dc.html" title="PDF-IMAGE-MANAGER" style="display:block;"><img src="./assets/PDF-IMG-MGR.png" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" /></a>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; flex-shrink:0; height:100px; padding:2px 0; justify-self:center;">
      <sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onClearSecondary }}" title="{{ clearSecondaryTitle }}" style="border:none; background:none; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px; color:#5980a6; text-transform:uppercase; white-space:nowrap; line-height:1;" style-hover="color:#416180;">{{ clearSecondaryLabel }}</button>
      </sc-if>
    </div>
    <div style="display:grid; grid-template-columns:repeat(4, 60px); row-gap:14px; column-gap:8px; justify-items:center; align-items:center; flex-shrink:0; justify-self:end;">
      <sc-for list="{{ otherTools }}" as="t" hint-placeholder-count="8">
        <a href="{{ t.file }}" title="{{ t.name }}"><img src="{{ t.assetSrc }}" style="width:44px; height:44px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid transparent; transition:border-color 0.2s ease, box-shadow 0.2s ease;" style-hover="border-color:rgba(29,31,32,0.25); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12);" /></a>
      </sc-for>
    </div>
  </div>
</sc-if>
<sc-if value="{{ showNarrow }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:0;">
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="{{ selfAssetSrc }}" title="{{ selfTitle }}" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
      <a href="./PDF-IMG-MGR.dc.html" title="PDF-IMAGE-MANAGER" style="display:block;"><img src="./assets/PDF-IMG-MGR.png" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" /></a>
    </div>
    <div style="display:grid; grid-template-columns:repeat(4, 80px); row-gap:20px; column-gap:8px; justify-items:center; align-items:center;">
      <sc-for list="{{ otherTools }}" as="t" hint-placeholder-count="8">
        <a href="{{ t.file }}" title="{{ t.name }}"><img src="{{ t.assetSrc }}" style="width:50px; height:50px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid transparent; transition:border-color 0.2s ease, box-shadow 0.2s ease;" style-hover="border-color:rgba(29,31,32,0.25); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12);" /></a>
      </sc-for>
    </div>
    <sc-if value="{{ hasSecondary }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onClearSecondary }}" title="{{ clearSecondaryTitle }}" style="border:none; background:none; padding:0; margin:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px; color:#5980a6; text-transform:uppercase; white-space:nowrap; line-height:1;" style-hover="color:#416180;">{{ clearSecondaryLabel }}</button>
    </sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:260},&quot;activeTool&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;PDF-MARKUP&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;PDF-MARKUP&quot;,&quot;PDF-FLATTENER&quot;,&quot;PDF-CREATOR&quot;,&quot;PDF-SPLITTER&quot;,&quot;PDF-WATERMARK&quot;,&quot;PDF-JPG&quot;,&quot;PDF-PNG&quot;,&quot;IMAGE-CONVERTER&quot;,&quot;IMAGE-SPLITTER&quot;]},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;clearLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CLICK TO CLEAR DROP-BOX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClearSecondary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(() =&gt; void) | undefined&quot;},&quot;clearSecondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clearSecondaryTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TOOLS = [
  { key: 'PDF-MARKUP', name: 'PDF-MARKUP', file: './PDF-MARKUP.dc.html', asset: 'PDF-MARKUP' },
  { key: 'PDF-FLATTENER', name: 'PDF-FLATTENER', file: './PDF-FLATTENER.dc.html', asset: 'PDF-FLATTENER' },
  { key: 'PDF-CREATOR', name: 'PDF-CREATOR', file: './PDF-CREATOR.dc.html', asset: 'PDF-CREATOR' },
  { key: 'PDF-SPLITTER', name: 'PDF-SPLITTER', file: './PDF-SPLITTER.dc.html', asset: 'PDF-SPLITTER' },
  { key: 'PDF-WATERMARK', name: 'PDF-WATERMARK', file: './PDF-WATERMARK.dc.html', asset: 'PDF-WATERMARK' },
  { key: 'PDF-JPG', name: 'PDF-JPG', file: './PDF-JPG.dc.html', asset: 'PDF-JPG' },
  { key: 'PDF-PNG', name: 'PDF-PNG', file: './PDF-PNG.dc.html', asset: 'PDF-PNG' },
  { key: 'IMAGE-CONVERTER', name: 'MULTI-IMAGE-CONVERTER', file: './IMAGE-CONVERTER.dc.html', asset: 'IMAGE-CONVERTER' },
  { key: 'IMAGE-SPLITTER', name: 'IMAGE-SPLITTER', file: './IMAGE-SPLITTER.dc.html', asset: 'IMAGE-SPLITTER' },
];

class Component extends DCLogic {
  state = {
    isMobile: typeof window !== 'undefined' && window.innerWidth < 640,
    headerNarrow: typeof window !== 'undefined' && window.innerWidth < 960,
  };

  componentDidMount() {
    this._onResize = () => {
      const isMobile = window.innerWidth < 640;
      const headerNarrow = window.innerWidth < 960;
      if (isMobile !== this.state.isMobile || headerNarrow !== this.state.headerNarrow) {
        this.setState({ isMobile, headerNarrow });
      }
    };
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }

  renderVals() {
    const { isMobile, headerNarrow } = this.state;
    const activeKey = this.props.activeTool || '';
    const self = TOOLS.find((t) => t.key === activeKey) || TOOLS[0];
    const otherTools = TOOLS.filter((t) => t.key !== self.key).map((t) => ({
      name: t.name, file: t.file, assetSrc: `./assets/${t.asset}.png`,
    }));
    return {
      showWide: !headerNarrow,
      showNarrow: headerNarrow,
      selfAssetSrc: `./assets/${self.asset}.png`,
      selfTitle: self.name,
      otherTools,
      hasSecondary: !!this.props.onClearSecondary,
      onClear: this.props.onClear,
      clearLabel: this.props.clearLabel,
      onClearSecondary: this.props.onClearSecondary,
      clearSecondaryLabel: this.props.clearSecondaryLabel,
      clearSecondaryTitle: this.props.clearSecondaryTitle,
    };
  }
}
</script>
</body>
</html>
