<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/industry-d2fd2168-52fe-46e0-884d-4a7d5e106dde/styles.css">
  <script src="_ds/industry-d2fd2168-52fe-46e0-884d-4a7d5e106dde/_ds_bundle.js"></script>
</helmet>

<div
  onDragOver="{{ onDragOver }}"
  onDragLeave="{{ onDragLeave }}"
  onDrop="{{ onDrop }}"
  onClick="{{ onDropzoneClick }}"
  onContextMenu="{{ onRightClickPaste }}"
  class="blueprint"
  style="border-color:{{ dropBorderColor }}; padding:{{ boxPadding }}; text-align:center; cursor:pointer; background:{{ dropBg }}; margin-bottom:{{ boxMarginBottom }}; max-width:{{ maxWidth }}; margin-left:auto; margin-right:auto; height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center;"
>
  <i class="corner tl"></i>
  <i class="corner tr"></i>
  <i class="corner bl"></i>
  <i class="corner br"></i>
  <sc-if value="{{ hasFileName }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ onClearClick }}" title="Clear the file list" class="btn btn-secondary" style="position:absolute; right:6px; bottom:6px; padding:4px 10px; font-size:11px;">CLEAR</button>
  </sc-if>
  <sc-if value="{{ hasThumbnails }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ stopPropagation }}" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; max-height:220px; overflow-y:auto; margin-bottom:8px;">
      <sc-for list="{{ thumbnails }}" as="thumb" hint-placeholder-count="2">
        <div style="width:64px; height:64px; border:1px solid var(--color-divider); background:var(--color-bg); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;">
          <img src="{{ thumb.url }}" style="max-width:100%; max-height:100%; object-fit:contain; display:block;" />
        </div>
      </sc-for>
    </div>
  </sc-if>
  <div style="font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:18px; margin-bottom:4px;">{{ headline }}</div>
  <div class="text-muted" style="font-size:13px; line-height:1.5;">{{ fileTypesLabel }}<sc-if value="{{ showBrowseHint }}" hint-placeholder-val="{{ true }}"> Click drop-box to browse files.</sc-if></div>
  <sc-if value="{{ hasFileName }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:13px; font-weight:600; margin-top:6px;">{{ fileName }}</div>
  </sc-if>
  <input ref="{{ fileInputRef }}" type="file" multiple="{{ allowMultiple }}" accept="{{ acceptTypes }}" onChange="{{ onFileInput }}" style="display:none" />
  <sc-if value="{{ showExtras }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ stopPropagation }}" style="display:flex; gap:8px; margin-top:16px;">
      <input class="input" type="text" value="{{ urlInput }}" onChange="{{ onUrlInputChange }}" placeholder="{{ urlPlaceholder }}" style="flex:1; min-width:0;" />
      <button class="btn btn-primary" onClick="{{ loadFromUrl }}" style="white-space:nowrap;">Load URL</button>
    </div>
    <button class="btn btn-secondary" onClick="{{ onPasteClick }}" style="margin-top:16px;">Paste from clipboard</button>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;fileTypesLabel&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;PDF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;acceptTypes&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;.pdf,application/pdf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;allowMultiple&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;urlPlaceholder&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;Or paste a PDF URL…&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;DROP-BOX&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxWidth&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;boxPadding&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;28px 24px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;boxMarginBottom&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;24px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showBrowseHint&quot;:{&quot;editor&quot;:null,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showExtras&quot;:{&quot;editor&quot;:null,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dropBorderColor&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;dropBg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;hasFileName&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fileName&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hasThumbnails&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;thumbnails&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{url:string}[]&quot;},&quot;onDragOver&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDragLeave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDrop&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onDropzoneClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;fileInputRef&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Ref&quot;},&quot;onFileInput&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;urlInput&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onUrlInputChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;loadFromUrl&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onPasteClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;stopPropagation&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  onRightClickPaste = (e) => {
    e.preventDefault();
    if (this.props.onPasteClick) this.props.onPasteClick();
  };
  onClearClick = (e) => {
    e.stopPropagation();
    if (this.props.onClear) this.props.onClear();
  };
  renderVals() {
    return { ...this.props, onRightClickPaste: this.onRightClickPaste, onClearClick: this.onClearClick };
  }
}
</script>
</body>
</html>
