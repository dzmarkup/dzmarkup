<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>PDF-IMG-MGR</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" />
  <style>
    a { color: #5980a6; }
    a:hover { color: #416180; }
    .dropbox-flex-fix > .sc-host { flex: 1; min-width: 0; }
  </style>
</helmet>
<div style="min-height:100vh; background:#fff; font-family:'Barlow',system-ui,sans-serif; color:#1d1f20; display:flex; justify-content:center; padding:{{ outerPadding }};">
  <div style="max-width:900px; width:100%; display:flex; flex-direction:column;">
    <dc-import name="Notepad" hint-size="100%,60px" storage-key="sharedNotepad"></dc-import>

<dc-import name="DropBox" hint-size="100%,165px"
      headline="DROP-BOX"
      box-padding="16px 20px"
      box-margin-bottom="14px"
      file-types-label="PDF, JPG, PNG, WebP, GIF, BMP, SVG, AVIF"
      allow-multiple="{{ true }}"
      drop-border-color="{{ dropBorderColor }}"
      drop-bg="{{ dropBg }}"
      on-drag-over="{{ onDragOver }}"
      on-drag-leave="{{ onDragLeave }}"
      on-drop="{{ onDrop }}"
      on-dropzone-click="{{ onDropzoneClick }}"
      file-input-ref="{{ fileInputRef }}"
      on-file-input="{{ onFileInput }}"
      url-input="{{ dropUrlInput }}"
      on-url-input-change="{{ onDropUrlInputChange }}"
      load-from-url="{{ loadFromDropUrl }}"
      stop-propagation="{{ stopPropagation }}"
      on-paste-click="{{ onDropPasteClick }}"
    ></dc-import>

    <div style="display:grid; grid-template-columns:repeat({{ tileCols }}, 1fr); gap:10px;">
      <sc-for list="{{ tiles }}" as="tile" hint-placeholder-count="8">
        <a
          href="{{ tile.href }}"
          onClick="{{ tile.onClick }}"
          style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; aspect-ratio:1; border:1px solid {{ tile.borderColor }}; background:#fff; text-decoration:none; color:#1d1f20; padding:8px 4px; pointer-events:{{ tile.pointerEvents }}; opacity:{{ tile.opacity }}; filter:{{ tile.filterCss }}; transition:opacity 0.3s ease, filter 0.3s ease;"
        >
          <div style="position:absolute; top:-4px; left:-4px; width:8px; height:8px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:3px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:3px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; top:-4px; right:-4px; width:8px; height:8px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:3px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:3px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; bottom:-4px; left:-4px; width:8px; height:8px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:3px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:3px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; bottom:-4px; right:-4px; width:8px; height:8px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:3px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:3px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <sc-if value="{{ tile.hasLogo }}" hint-placeholder-val="{{ false }}">
            <img src="{{ tile.logo }}" style="width:{{ tile.logoSize }}px; height:{{ tile.logoSize }}px; object-fit:contain; display:block; transition:width 0.3s ease, height 0.3s ease;" />
          </sc-if>
          <sc-if value="{{ tile.noLogo }}" hint-placeholder-val="{{ true }}">
            <div style="width:{{ tile.initialsSize }}px; height:{{ tile.initialsSize }}px; border:1px solid {{ tile.borderColor }}; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ tile.initialsFontSize }}px; color:{{ tile.iconColor }}; transition:width 0.3s ease, height 0.3s ease;">{{ tile.initials }}</div>
          </sc-if>
          <div style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ tile.labelSize }}px; line-height:1.15; text-align:center; transition:font-size 0.3s ease; padding:0 2px;">{{ tile.label }}</div>
        </a>
      </sc-for>
    </div>

    <div style="display:grid; grid-template-columns:{{ headerGridCols }}; gap:14px; align-items:center; margin-top:28px;">
      <img src="./assets/PDF-IMG-MGR.png" style="width:{{ headerLogoSize }}px; height:{{ headerLogoSize }}px; object-fit:contain; justify-self:center;" />
      <h1 style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ titleFontSize }}px; letter-spacing:-0.015em; margin:0; text-align:{{ titleAlign }}; white-space:{{ titleWrap }};">PDF-IMAGE-MANAGER</h1>
      <a href="http://bluejetty.ca" target="_blank" rel="noopener" style="justify-self:center;">
        <img src="./assets/bluejetty.png" style="width:{{ headerLogoSize }}px; height:{{ headerLogoSize }}px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease, border-radius 0.2s ease, box-shadow 0.2s ease;" style-hover="width:100px; height:100px; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
let idCounter = 1;
const MAX_BYTES = 200 * 1024 * 1024;
const WARN_BYTES = MAX_BYTES * 0.6;

class Component extends DCLogic {
  state = { files: [], dragOver: false, dropUrlInput: '', isMobile: typeof window !== 'undefined' && window.innerWidth < 640 };
  fileInputRef = React.createRef();
  warned = false;

  componentDidMount() {
    this._blockNav = (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; };
    window.addEventListener('dragover', this._blockNav);
    window.addEventListener('drop', this._blockNav);
    this._onResize = () => {
      const isMobile = window.innerWidth < 640;
      if (isMobile !== this.state.isMobile) this.setState({ isMobile });
    };
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('dragover', this._blockNav);
    window.removeEventListener('drop', this._blockNav);
    window.removeEventListener('resize', this._onResize);
  }

  onDropzoneClick = () => this.fileInputRef.current && this.fileInputRef.current.click();
  onDragOver = (e) => { e.preventDefault(); this.setState({ dragOver: true }); };
  onDragLeave = (e) => { e.preventDefault(); this.setState({ dragOver: false }); };

  classifyFile(file) {
    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) return 'pdf';
    if (file.type.startsWith('image/')) return 'image';
    return null;
  }

  handleFiles(fileList) {
    const accepted = [];
    const rejectedType = [];
    const rejectedSize = [];
    let total = this.state.files.reduce((sum, f) => sum + (f.fileObj.size || 0), 0);

    Array.from(fileList).forEach((file) => {
      const category = this.classifyFile(file);
      if (!category) { rejectedType.push(file.name); return; }
      if (total + file.size > MAX_BYTES) { rejectedSize.push(file.name); return; }
      total += file.size;
      accepted.push({ id: idCounter++, name: file.name, category, used: true, fileObj: file });
    });

    if (accepted.length) this.setState((s) => ({ files: [...s.files, ...accepted] }));
    if (rejectedType.length) alert('Only PDF and image files are accepted. Skipped: ' + rejectedType.join(', '));
    if (rejectedSize.length) alert(`This session's ${MAX_BYTES / (1024 * 1024)}MB file limit would be exceeded. Skipped: ` + rejectedSize.join(', '));
    if (!this.warned && total >= WARN_BYTES) {
      this.warned = true;
      alert(`You're approaching this session's file size limit (${Math.round(total / (1024 * 1024))}MB of ${MAX_BYTES / (1024 * 1024)}MB used). Adding much more may be rejected.`);
    }
  }

  onDrop = (e) => {
    e.preventDefault();
    this.setState({ dragOver: false });
    if (e.dataTransfer.files && e.dataTransfer.files.length) this.handleFiles(e.dataTransfer.files);
  };

  onFileInput = (e) => {
    if (e.target.files && e.target.files.length) this.handleFiles(e.target.files);
    e.target.value = '';
  };

  stopPropagation = (e) => e.stopPropagation();
  onDropUrlInputChange = (e) => this.setState({ dropUrlInput: e.target.value });

  loadFromDropUrl = async () => {
    const url = (this.state.dropUrlInput || '').trim();
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const name = (url.split('/').pop() || 'file').split('?')[0] || 'file';
      this.setState({ dropUrlInput: '' });
      this.handleFiles([new File([blob], name, { type: blob.type })]);
    } catch (err) {
      alert('Could not load that URL (it may block cross-origin access): ' + err.message);
    }
  };

  onDropPasteClick = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/') || type === 'application/pdf') {
              const blob = await item.getType(type);
              const ext = type.split('/')[1] || 'png';
              this.handleFiles([new File([blob], `pasted.${ext}`, { type })]);
              return;
            }
          }
        }
      }
      alert('Clipboard access denied or no file found. Try pressing Ctrl+V instead.');
    } catch (err) {
      alert('Could not read clipboard. Try pressing Ctrl+V instead.');
    }
  };

  async handoffAndNavigate(tile, e) {
    e.preventDefault();
    const relevant = this.state.files.filter((f) => f.used && f.category === tile.category);
    if (relevant.length) {
      try {
        const encoded = await Promise.all(relevant.map((f) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: f.name, type: f.fileObj.type, dataUrl: reader.result });
          reader.onerror = reject;
          reader.readAsDataURL(f.fileObj);
        })));
        localStorage.setItem('pdfImageManagerHandoff', JSON.stringify({ ts: Date.now(), files: encoded }));
      } catch (err) {
        console.warn('Handoff failed', err);
      }
    }
    window.location.href = tile.href;
  }

  toggleUse(id) {
    this.setState((s) => ({ files: s.files.map((f) => (f.id === id ? { ...f, used: !f.used } : f)) }));
  }

  removeFile(id) {
    const file = this.state.files.find((f) => f.id === id);
    if (!file) return;
    if (confirm(`Remove "${file.name}" from the list?`)) {
      this.setState((s) => ({ files: s.files.filter((f) => f.id !== id) }));
    }
  }



  renderVals() {
    const { files, dragOver, isMobile } = this.state;
    const usedCategories = new Set(files.filter((f) => f.used).map((f) => f.category));
    let detected = null;
    if (usedCategories.size === 1) detected = [...usedCategories][0];

    const pdfActive = [
      { label: 'PDF-MARKUP', initials: 'MRK', subtitle: 'PDF → PDF', href: './PDF-MARKUP.dc.html', logo: './assets/PDF-MARKUP.png' },
      { label: 'PDF-FLATTENER', initials: 'FLT', subtitle: 'PDF → PDF', href: './PDF-FLATTENER.dc.html', logo: './assets/PDF-FLATTENER.png' },
      { label: 'PDF-CREATOR', initials: 'PDF', subtitle: 'ALL → PDF', href: './PDF-CREATOR.dc.html', logo: './assets/PDF-CREATOR.png' },
      { label: 'PDF-SPLITTER', initials: 'SPL', subtitle: 'PDF → PDF', href: './PDF-SPLITTER.dc.html', logo: './assets/PDF-SPLITTER.png' },
      { label: 'PDF-WATERMARK', initials: 'WTM', subtitle: 'PDF → PDF', href: './PDF-WATERMARK.dc.html', logo: './assets/PDF-WATERMARK.png' },
      { label: 'PDF-JPG', initials: 'JPG', subtitle: 'PDF → JPG', href: './PDF-JPG.dc.html', logo: './assets/PDF-JPG.png' },
      { label: 'PDF-PNG', initials: 'PNG', subtitle: 'PDF → PNG', href: './PDF-PNG.dc.html', logo: './assets/PDF-PNG.png' },
    ];
    const imageActive = [
      { label: 'MULTI-IMAGE-CONVERTER', initials: 'IMG', subtitle: 'JPG PNG WEBP GIF BMP SVG AVIF → JPG PNG WEBP GIF BMP SVG AVIF', href: './IMAGE-CONVERTER.dc.html', logo: './assets/IMAGE-CONVERTER.png' },
      { label: 'IMAGE-SPLITTER', initials: 'SPL', subtitle: 'PNG JPG WEBP GIF BMP SVG AVIF → PNG JPG WEBP GIF BMP SVG AVIF', href: './IMAGE-SPLITTER.dc.html', logo: './assets/IMAGE-SPLITTER.png' },
    ];

    const realPdf = pdfActive.map((t) => ({ ...t, category: 'pdf' }));
    const realImage = imageActive.map((t) => ({ ...t, category: 'image' }));

    const ordered = detected === 'image' ? [...realImage, ...realPdf] : [...realPdf, ...realImage];

    const tiles = ordered.map((t) => {
      const isMatch = detected && t.category === detected;
      const isOpposing = detected && t.category !== detected;

      let logoSize = isMobile ? 44 : 94, initialsSize = isMobile ? 26 : 41, initialsFontSize = isMobile ? 10 : 14, labelSize = isMobile ? 11 : 18, subtitleSize = 10;
      let opacity = 1;
      let filterCss = 'none';
      let borderColor = '#5980a6';
      let iconColor = '#5980a6';

      if (isMatch) {
        logoSize = isMobile ? 66 : 146; initialsSize = isMobile ? 36 : 62; initialsFontSize = isMobile ? 13 : 21; labelSize = isMobile ? 11 : 18; subtitleSize = 11;
      } else if (isOpposing) {
        logoSize = isMobile ? 24 : 50; initialsSize = isMobile ? 14 : 24; initialsFontSize = isMobile ? 7 : 10; labelSize = isMobile ? 7 : 18; subtitleSize = 7;
        opacity = 0.35;
        filterCss = 'blur(2px)';
      }

      const hasLogo = !!t.logo;
      return {
        ...t,
        logo: t.logo || '',
        borderColor, iconColor, opacity, filterCss,
        pointerEvents: 'auto',
        hasLogo,
        noLogo: !hasLogo,
        logoSize, initialsSize, initialsFontSize, labelSize, subtitleSize,
        onClick: (e) => this.handoffAndNavigate(t, e),
      };
    });

    return {
      tiles,
      files: files.map((f) => ({
        ...f,
        fontWeight: f.used ? 700 : 400,
        fontSize: f.used ? 15 : 13,
        textColor: f.used ? '#1d1f20' : 'rgba(29,31,32,0.4)',
        categoryLabel: f.category === 'pdf' ? 'PDF' : 'IMAGE',
        tagBg: f.category === 'pdf' ? '#eef6ff' : '#f2ede6',
        tagColor: f.category === 'pdf' ? '#2c455d' : '#6b5a3a',
        useBg: f.used ? '#5980a6' : 'transparent',
        useColor: f.used ? '#f2f2f3' : '#1d1f20',
        useBorder: f.used ? '#5980a6' : 'rgba(29,31,32,0.16)',
        toggleUse: () => this.toggleUse(f.id),
        remove: () => this.removeFile(f.id),
      })),
      noFiles: files.length === 0,
      fileInputRef: this.fileInputRef,
      onDropzoneClick: this.onDropzoneClick,
      onDragOver: this.onDragOver,
      onDragLeave: this.onDragLeave,
      onDrop: this.onDrop,
      onFileInput: this.onFileInput,
      dropUrlInput: this.state.dropUrlInput,
      onDropUrlInputChange: this.onDropUrlInputChange,
      loadFromDropUrl: this.loadFromDropUrl,
      stopPropagation: this.stopPropagation,
      onDropPasteClick: this.onDropPasteClick,
      dropBorderColor: dragOver ? '#5980a6' : 'rgba(29,31,32,0.16)',
      dropBg: dragOver ? '#eef6ff' : '#f2f2f3',
      dropHeadline: detected === 'pdf' ? 'PDF tools highlighted below'
        : detected === 'image' ? 'Image tools highlighted below'
        : 'DROP-BOX',
      outerPadding: isMobile ? '10px 14px 28px' : '18px 24px 56px',
      headerGridCols: isMobile ? '1fr 1fr 1fr' : '1fr auto 1fr',
      headerLogoSize: isMobile ? 79 : 150,
      titleFontSize: isMobile ? 26 : 42,
      titleAlign: isMobile ? 'center' : 'left',
      titleWrap: isMobile ? 'normal' : 'nowrap',
      dropRowCols: isMobile ? '1fr' : 'repeat(4, 1fr)',
      dropBoxSpan: isMobile ? 'span 1' : 'span 2',
      droppedFilesSpan: isMobile ? 'span 1' : 'span 2',
      tileCols: isMobile ? 3 : 4,
      isDesktopHeader: !isMobile,
    };
  }
}
</script>
</body>
</html>
